name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  lint-backend:
    name: lint-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --workspaces=false

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

  lint-frontend:
    name: lint-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint -w frontend

  build-backend:
    name: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --workspaces=false

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Build backend
        working-directory: backend
        run: npm run build

  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_SERVER_API_URL: http://localhost:4000
      NEXT_PUBLIC_SHOW_DEV_TOOLS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w frontend

  e2e-backend:
    name: e2e-backend
    runs-on: ubuntu-latest
    needs:
      - build-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selecao_posgrad
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d selecao_posgrad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/selecao_posgrad?schema=public
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET: change-me-in-real-environments
      UPLOADS_DIR: storage/uploads
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --workspaces=false

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Apply database migrations
        working-directory: backend
        run: npm run prisma:deploy

      - name: Run backend E2E tests
        working-directory: backend
        run: npm run test:e2e

  e2e-frontend:
    name: e2e-frontend
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selecao_posgrad
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d selecao_posgrad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/selecao_posgrad?schema=public
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_SERVER_API_URL: http://localhost:4000
      PLAYWRIGHT_API_URL: http://localhost:4000
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      JWT_SECRET: change-me-in-real-environments
      UPLOADS_DIR: storage/uploads
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install workspace dependencies
        run: npm ci

      - name: Install backend isolated dependencies
        working-directory: backend
        run: npm ci --workspaces=false

      - name: Install Playwright browser
        run: npm exec -w frontend -- playwright install --with-deps chromium

      - name: Generate Prisma client
        working-directory: backend
        run: npm run prisma:generate

      - name: Apply database migrations
        working-directory: backend
        run: npm run prisma:deploy

      - name: Seed database
        working-directory: backend
        run: npm run prisma:seed

      - name: Start backend
        working-directory: backend
        run: |
          npm run dev > ../backend.log 2>&1 &
          echo $! > backend.pid
          for attempt in {1..60}; do
            if curl -fsS http://localhost:4000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../backend.log
          exit 1

      - name: Start frontend
        run: |
          npm run dev -w frontend > frontend.log 2>&1 &
          echo $! > frontend.pid
          for attempt in {1..60}; do
            if curl -fsS http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat frontend.log
          exit 1

      - name: Run frontend E2E tests
        run: npm run test:e2e -w frontend

      - name: Upload runtime logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-runtime-logs
          path: |
            backend.log
            frontend.log
            frontend/test-results/**
          if-no-files-found: ignore
