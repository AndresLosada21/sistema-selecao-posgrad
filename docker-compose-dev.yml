services:
  postgres:
    image: postgres:16-alpine
    container_name: selecao-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selecao_posgrad}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-selecao_posgrad}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    container_name: selecao-backend-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/selecao_posgrad?schema=public}
      DOCUMENTOS_EDITAL_DIR: /documentos-edital
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-real-environments}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - ../Documentos-Edital:/documentos-edital:ro
      - backend_node_modules:/app/node_modules
    command: sh /app/docker/dev-entrypoint.sh

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: selecao-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh /app/docker/dev-entrypoint.sh

volumes:
  postgres_dev_data:
  backend_node_modules:
  frontend_node_modules:
